<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Pixel-art telescope on its tripod, one star. 16 × 16 grid: every rect is whole pixels, drawn crisp. -->
  <rect width="16" height="16" rx="3" fill="#0a0c10"/>
  <g shape-rendering="crispEdges">
    <!-- Star (accent) -->
    <rect x="3" y="2" width="1" height="1" fill="#ff4d5a"/>
    <!-- Tube, stepping up to the right -->
    <rect x="4" y="9" width="2" height="2" fill="#cdd0cc"/>
    <rect x="6" y="8" width="2" height="2" fill="#cdd0cc"/>
    <rect x="8" y="7" width="2" height="2" fill="#f1f1ec"/>
    <rect x="10" y="6" width="2" height="2" fill="#f1f1ec"/>
    <!-- Dew shield and objective at the front -->
    <rect x="12" y="4" width="2" height="3" fill="#f1f1ec"/>
    <rect x="14" y="4" width="1" height="3" fill="#7ea6d8"/>
    <!-- Eyepiece at the back -->
    <rect x="3" y="11" width="1" height="1" fill="#949aa3"/>
    <!-- Mount and tripod -->
    <rect x="8" y="9" width="1" height="5" fill="#949aa3"/>
    <rect x="7" y="11" width="1" height="1" fill="#949aa3"/>
    <rect x="6" y="12" width="1" height="1" fill="#949aa3"/>
    <rect x="5" y="13" width="1" height="1" fill="#949aa3"/>
    <rect x="9" y="11" width="1" height="1" fill="#949aa3"/>
    <rect x="10" y="12" width="1" height="1" fill="#949aa3"/>
    <rect x="11" y="13" width="1" height="1" fill="#949aa3"/>
  </g>
</svg>
